<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Prime Bites</title>
    <script>
      // Redirects deep links to index.html so client-side routing can take over.
      // GitHub Pages has no server-side rewrites, so a direct hit on e.g.
      // /cedricdurio/restaurant/basil-and-vine would otherwise 404.
      var pathSegmentsToKeep = 1
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          l.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
